<ul class="todo-list">
    {% if todos %}
        {% for todo in todos %}
        <li class="{% if todo.status == 1 %}done{% endif %}">
            <span class="info"
                  hx-put="/todos/{{ todo.id }}/toggle"
                  hx-target="#todo-list"
                  hx-swap="innerHTML">
                {{ todo.info }}
            </span>
            <span class="actions">
                <button class="btn btn-sm"
                        hx-get="/todos/{{ todo.id }}/edit"
                        hx-target="closest li"
                        hx-swap="outerHTML">
                    ✏️
                </button>
                <button class="btn btn-sm btn-danger"
                        hx-delete="/todos/{{ todo.id }}"
                        hx-target="#todo-list"
                        hx-swap="innerHTML"
                        hx-confirm="确定要删除吗？">
                    🗑️
                </button>
            </span>
        </li>
        {% endfor %}
    {% else %}
        <li class="empty">暂无待办事项，在上方输入框添加</li>
    {% endif %}
</ul>
