<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - HTMX 版</title>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- 外部 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📋 待办事项（HTMX 版）</h1>
        <p class="subtitle">不写一行 JavaScript 的 AJAX——用 HTML 属性实现局部刷新</p>

        <!-- 新增表单 -->
        <form class="add-form"
              hx-post="/todos"
              hx-target="#todo-list"
              hx-swap="innerHTML"
              hx-on::after-request="this.reset()">
            <input type="text" name="info" placeholder="输入待办事项..." required>
            <button type="submit" class="btn btn-primary">+ 新增</button>
        </form>

        <!-- 待办列表 -->
        <div id="todo-list">
            {% include "partials/todo_list.html" %}
        </div>
    </div>

    <!-- 说明 -->
    <div class="info-box">
        <strong>💡 HTMX 版：</strong>
        不用 Vue.js，通过 HTMX 的 <code>hx-*</code> 属性实现局部刷新。<br>
        点击操作 → 发 AJAX → 后端返回 HTML 片段 → HTMX 自动替换页面内容。<br>
        先理解「局部刷新」原理，再学前端框架。<br>
        下一站：<a href="http://localhost:8000">app（Vue.js SPA）</a> — 前端完全接管页面。
    </div>
</body>
</html>
